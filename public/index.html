<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup Sweepstake</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>World Cup Sweepstake</h1>
      <nav><a href="/">Standings</a> · <a href="/admin.html">Admin</a></nav>
    </header>

    <main>
      <section>
        <h2>League Table</h2>
        <div id="league-status" class="muted">Loading…</div>
        <table id="league-table" hidden>
          <thead>
            <tr><th>Rank</th><th>Participant</th><th>Points</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2>Prizes</h2>
        <p><strong>Tournament winner:</strong> <span id="tournament-winner" class="muted">—</span></p>
        <p><strong>League prize:</strong> <span id="league-prize" class="muted">—</span></p>
      </section>

      <section>
        <h2>Assignments</h2>
        <div id="assignments" class="muted">Loading…</div>
      </section>
    </main>

    <footer class="muted">Read-only view. Updates are made by the administrator.</footer>

    <script src="/app.js"></script>
  </body>
</html>
